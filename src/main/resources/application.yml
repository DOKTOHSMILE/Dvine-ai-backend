server:
  port: ${PORT:8088}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  datasource:
    url: jdbc:h2:mem:dvine-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  flyway:
    enabled: true

dvine:
  bootstrap-enabled: false
  bootstrap-token: ${DVINE_BOOTSTRAP_TOKEN:}
  # phones register themselves (no secret in the app); rate-limited per address
  device-registration-enabled: ${DVINE_DEVICE_REGISTRATION:true}
  device-registrations-per-hour: ${DVINE_DEVICE_REGISTRATIONS_PER_HOUR:10}
  # new questions per user per minute (replays of a request id are free)
  commands-per-minute: ${DVINE_COMMANDS_PER_MINUTE:20}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DVINE_DB_URL}
    username: ${DVINE_DB_USER}
    password: ${DVINE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
