server:
  port: ${PORT:8088}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  datasource:
    url: jdbc:h2:mem:dvine-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  flyway:
    enabled: true

dvine:
  bootstrap-enabled: false
  bootstrap-token: ${DVINE_BOOTSTRAP_TOKEN:}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DVINE_DB_URL}
    username: ${DVINE_DB_USER}
    password: ${DVINE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
